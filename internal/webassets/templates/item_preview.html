{{define "item_preview"}}
<p class="backlink"><a href="/admin/feeds/{{.Feed.ID}}">&larr; {{if .Feed.Title}}{{.Feed.Title}}{{else}}Feed{{end}}</a>{{if .Item.URL}} &middot; <a class="btn btn-sm" href="/admin/rules/picker?item={{.Item.ID}}">Pick rule</a>{{end}}</p>
<div class="detail-head">
  <h1>{{.Item.Title}}</h1>
  <p class="status-line">
    {{if .Item.URL}}<a href="{{.Item.URL}}" rel="noreferrer">{{.Item.URL}}</a>{{end}}
    {{if .Item.Author}} &middot; {{.Item.Author}}{{end}}
  </p>
</div>

<div class="preview-grid">
  <section class="preview-pane">
    <div class="pane-label">Rendered</div>
    <div class="pane-body article-html">{{.Item.ContentHTML}}</div>
  </section>
  <section class="preview-pane">
    <div class="pane-label">Raw HTML</div>
    <pre class="raw-html"><code>{{.Item.RawHTML}}</code></pre>
  </section>
</div>
{{end}}
