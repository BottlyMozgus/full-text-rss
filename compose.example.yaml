services:
  rss-scraper:
    build: .
    container_name: rss-scraper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required: pick ONE of these
      - FTRSS_ADMIN_PASSWORD=changeme
      # - FTRSS_ADMIN_TOKEN=static-token-for-api-and-ui
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
